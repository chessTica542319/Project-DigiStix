{% extends "base.html" %}

{% block title %}Admin Login | DigiStix{% endblock %}

{% block content %}
<section>
    <h1>Log in to DigiStix</h1>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                maxlength="80"
                autocomplete="username"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit">Log in</button>
    </form>
</section>
{% endblock %}
